summary: get all blogs from the lastest
      parameters:
        - $ref: '#/components/parameters/PageLimitParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A list of all blogs
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Blogs retrieved successfully.   
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          example: "019143a0-c5cc-7c8b-be12-7b8143c3c60a"
                        title:
                          type: string
                          example: "Airplane crash due to stalling"
                        content:
                          type: string
                          example: "Brazil is somehwbrbere to pay sowntng"
                        category_id:
                          type: string
                          format: uuid
                        category:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                              example: "news"
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time
                        image_url:
                          type: string
                          format: uri
                          example: "https://brazil.com"
                        author_id:
                          type: string
                          format: uuid
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
        
        '400':
          description: Failed to fetch all blogs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'