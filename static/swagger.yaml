              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "User invited successfully"
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: The JWT access token.
                        example: "eyJhbGciE...."
                      user:
                        type: object
                        properties:
                          avatar_url:
                            type: string
                            description: URL of the user's avatar image.
                            example: ""
                          created_at:
                            type: string
                            format: date-time
                            description: Timestamp of when the user was created.
                            example: "1723741256"
                          email:
                            type: string
                            format: email
                            description: The user's email address.
                            example: "blessing@gmail.com"
                          expires_in:
                            type: string
                            format: date-time
                            description: Timestamp of when the access token expires.
                            example: "1723914056"
                          first_name:
                            type: string
                            description: The user's first name.
                            example: "Blessing@Gmail.Com"
                          fullname:
                            type: string
                            description: The user's full name.
                            example: "Blessing@Gmail.Com"
                          id:
                            type: string
                            format: uuid
                            description: The user's unique identifier.
                            example: "019156fc-3a25-783c-bb6c-813aa4abd2e9"
