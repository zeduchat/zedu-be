  /search/organisation/{orgId}/:
    get:
      tags:
        - Search
      summary: Search for messages within an organization for a specific user
      description: |
        Search for messages within an organization based on various keyword-based filters.
        The entire search query, including keywords, is passed in the `query` parameter.
        Example format: `"Hello word how are you from:layo before:2024-12-31"`

        #### Supported Keywords:
        - **from:** *Filter messages by sender* (e.g., `from:layo`)
        - **in:** *Filter messages by channel name* (e.g., `in:general`)
        - **has:** *Search for messages containing a specific word* (e.g., `has:meeting`)
        - **before:** *Find messages sent before a specific date* (e.g., `before:2024-12-31`)
        - **on:** *Find messages sent on a specific date* (e.g., `on:2024-12-27`)
        - **after:** *Find messages sent after a specific date* (e.g., `after:2024-12-25`)
        - **exact:** *Find messages matching an exact phrase* (e.g., `exact:Project deadline`)

        You can chain multiple keywords together, for example:
        `"Hello team has:meeting before:2024-12-31 from:layo"`
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          description: The unique identifier for the organization
          schema:
            type: string
            format: uuid

        - name: query
          in: query
          required: false
          description: The keyword(s) to filter messages by
          schema:
            type: string

        - name: sortBy
          in: query
          required: false
          description: Sort the results by relevance or recency
          schema:
            type: string
            enum: [relevance, recency]

      responses:
        200:
          description: Successful response with filtered messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "success"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user:
                          type: object
                          properties:
                            user_id:
                              type: string
                              format: uuid
                              example: "0195ae92-d864-7415-8411-d417931a9b3a"
                            user_name:
                              type: string
                              example: "layo bright"
                            avatar_url:
                              type: string
                              format: uri
                              example: "https://example.com/avatar.jpg"
                        messages:
                          type: array
                          items:
                            type: object
                            properties:
                              message_id:
                                type: string
                                example: "12345"
                              message:
                                type: string
                                example: "Hello how are you and where do you come from"
                              timestamp:
                                type: string
                                format: date-time
                                example: "2024-12-27T10:57:34.648525826Z"
                        channel:
                          type: object
                          properties:
                            channel_id:
                              type: string
                              format: uuid
                              example: "019407ad-81aa-7c71-af9c-d6609e918809"
                            channel_name:
                              type: string
                              example: "General"

        400:
          description: Bad Request - Invalid parameters or missing required query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  status_code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: "Invalid query parameters provided"

        401:
          description: Unauthorized - Missing or invalid authentication token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  status_code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: "Unauthorized access - Invalid token"

        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  status_code:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: "An unexpected error occurred"
