  /invite:
    post:
      tags:
        - Organisation-Invitation
      summary: Create and send invitations
      description: Sends invitations to the specified email addresses to join the organization.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                org_id:
                  type: string
                  format: uuid
                  description: The ID of the organization to which the users are being invited.
                  example: "01918214-55e5-791b-9ebd-fa8d92d69fa1"
                emails:
                  type: array
                  items:
                    type: string
                  description: A list of email addresses to send invitations to.
                  example:
                    ["micahshallom@gmail.com", "micahshallom24@gmail.com"]
                role_id:
                  type: string
                  description: The role assigned to the invited users within the organization.
                  example: "01918214-55e5-791b-9ebd-fa8d92d69fa1"
      responses:
        "201":
          description: Invitations created and sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  status_code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "Invitations created successfully"
                  data:
                    type: object
                    properties:
                      errors:
                        type: array
                        items:
                          type: string
                        description: A list of errors encountered during the invitation process.
                        example:
                          - "An invitation has already been sent to micahshallom@gmail.com"
                          - "Error checking for telex presence: user with email micahshallom24@gmail.com does not exist"
                      invitations:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              description: The unique identifier for the invitation.
                              example: "019185b0-8fb4-767f-bd9d-d612e588f465"
                            email:
                              type: string
                              description: The email address to which the invitation was sent.
                              example: "micahshallom24@gmail.com"
                            org_id:
                              type: string
                              format: uuid
                              description: The ID of the organization to which the user is invited.
                              example: "01918214-55e5-791b-9ebd-fa8d92d69fa1"
                            status:
                              type: string
                              description: The status of the invitation.
                              example: "invited"
                            invite_token:
                              type: string
                              description: The unique token associated with the invitation.
                              example: "a351f47cea15f91ca16a3b18a04a8c22"
                            is_telex_user:
                              type: boolean
                              description: Indicates whether the invited user is already a Telex user.
                              example: false
                            invitation_link:
                              type: string
                              description: The link provided to the invited user for accepting the invitation.
                              example: "http://127.0.0.1:8019/api/v1/invite/accept_org_invitation?org_id=01918214-55e5-791b-9ebd-fa8d92d69fa1&invitation_token=a351f47cea15f91ca16a3b18a04a8c22"
                            sent_at:
                              type: string
                              format: date-time
                              description: The timestamp when the invitation was sent.
                              example: "2024-08-24T19:40:26.548569958+01:00"
                            expires_at:
                              type: string
                              format: date-time
                              description: The expiration timestamp of the invitation.
                              example: "2024-08-26T19:40:26.548423408+01:00"

  /invite/invite-few:
    post:
      tags:
        - Organisation-Invitation
      summary: Invite multiple users to an organisation
      description: Sends invitations to multiple users by email, each with an assigned role.
      operationId: inviteFewUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - org_id
                - invitations
              properties:
                org_id:
                  type: string
                  description: Organisation ID
                  example: "019700db-4e22-7f90-a20e-f9116291ef24"
                invitations:
                  type: array
                  description: List of users to invite
                  items:
                    type: object
                    required:
                      - email
                      - role
                    properties:
                      email:
                        type: string
                        format: email
                        example: "user9@gmail.com"
                      role:
                        type: string
                        description: Role ID to assign the invited user
                        example: "019700d8-9085-7f7b-839a-fcbd08b9e26d"
      responses:
        "201":
          description: Invitations successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Invitations created successfully
                  data:
                    type: object
                    properties:
                      errors:
                        type: object
                        nullable: true
                        example: null

  /invite/verify:
    post:
      tags:
        - Organisation-Invitation
      summary: Verify an invitation token
      security:
        - bearerAuth: []
      description: |
        This endpoint verifies an invitation token. Upon successful verification, it returns an access token and user details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: The invitation token to be verified.
                  example: "0d1f072a48c629397f20329d93ac8621"
      responses:
        "200":
          description: User invited successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "User invited successfully"
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: The JWT access token.
                        example: "eyJhbGciE...."
                      user:
                        type: object
                        properties:
                          avatar_url:
                            type: string
                            description: URL of the user's avatar image.
                            example: ""
                          created_at:
                            type: string
                            format: date-time
                            description: Timestamp of when the user was created.
                            example: "1723741256"
                          email:
                            type: string
                            format: email
                            description: The user's email address.
                            example: "blessing@gmail.com"
                          expires_in:
                            type: string
                            format: date-time
                            description: Timestamp of when the access token expires.
                            example: "1723914056"
                          first_name:
                            type: string
                            description: The user's first name.
                            example: "Blessing@Gmail.Com"
                          fullname:
                            type: string
                            description: The user's full name.
                            example: "Blessing@Gmail.Com"
                          id:
                            type: string
                            format: uuid
                            description: The user's unique identifier.
                            example: "019156fc-3a25-783c-bb6c-813aa4abd2e9"
                          is_onboarded:
                            type: boolean
                            description: Indicates whether the user has completed onboarding.
                            example: false
                          is_verified:
                            type: boolean
                            description: Indicates whether the user's email is verified.
                            example: false
                          last_name:
                            type: string
                            description: The user's last name.
