  /organisations/{organisation_id}/group-dms:
    get:
      tags:
        - Group Direct Message
      summary: Retrieve Group DM Channels
      security:
        - bearerAuth: []
      description: Retrieves all Group DM channels within a given organisation.
      parameters:
        - name: organisation_id
          in: path
          required: true
          schema:
            type: string
          description: The unique identifier of the organisation.
      responses:
        "200":
          description: Group DM channels retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        channel_id:
                          type: string
                        channel_type:
                          type: string
                        participants:
                          type: array
                          items:
                            type: object
                            properties:
                              user_id:
                                type: string
                              username:
                                type: string
                              avatar_url:
                                type: string
                              email:
                                type: string
                  pagination:
                    type: array
                    items:
                      type: object
                      properties:
                        current_page:
                          type: integer
                        limit:
                          type: integer
                        total_items:
                          type: integer
                        total_pages:
                          type: integer
    post:
      tags:
        - Group Direct Message
      summary: Create a Group DM Channel
      security:
        - bearerAuth: []
      description: Creates a new Group DM channel with specified participants.
      parameters:
        - name: organisation_id
          in: path
          required: true
          schema:
            type: string
          description: The unique identifier of the organisation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_type:
                  type: string
                  enum: [user]
                  description: Type of chat (currently only "user" is supported).
                participants:
                  type: array
                  items:
                    type: string
                  description: List of user IDs to be added to the Group DM.
              required:
                - chat_type
                - participants
            example:
              chat_type: "user"
              participants:
                - "0195bbf5-87c2-779b-9609-060f6bb8f2b1"
                - "0195bbf5-87c2-779b-9609-060f6bb8f2b2"
                - "0195bbf5-87c2-779b-9609-060f6bb8f2b3"
      responses:
        "201":
          description: Group DM channel created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      channel_id:
                        type: string
                        description: Unique identifier for the newly created Group DM channel.
                      channel_type:
                        type: string
                        description: Type of channel.
                      participants:
                        type: array
                        items:
                          type: object
                          properties:
                            user_id:
                              type: string
                              description: Unique identifier of the participant.
                            username:
                              type: string
                              description: Username of the participant.
                            avatar_url:
                              type: string
                              format: uri
                              description: URL of the participant's avatar.
                            email:
                              type: string
                              format: email
                              description: Email of the participant.
                example:
                  status: "success"
                  status_code: 201
                  message: "Group DM channel created successfully"
                  data:
                    channel_id: "0195c046-c8fa-7341-b9ea-f463de6a82d5"
                    channel_type: "group_dm"
                    participants:
                      - user_id: "0191be6d-4e1b-7b47-8f92-4f009762cfaa"
                        username: "micahshallom"
                        avatar_url: ""
                        email: "micahshallom@gmail.com"
                      - user_id: "0195bbf5-87c2-779b-9609-060f6bb8f2b1"
                        username: "user1"
                        avatar_url: ""
                        email: "user1@gmail.com"
                      - user_id: "0195bbf5-87c2-779b-9609-060f6bb8f2b2"
                        username: "user2"
                        avatar_url: ""
                        email: "user2@gmail.com"
                      - user_id: "0195bbf5-87c2-779b-9609-060f6bb8f2b6"
                        username: "user6"
                        avatar_url: ""
                        email: "user6@gmail.com"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                example:
                  status: "error"
                  status_code: 400
                  message: "Invalid request payload"
        "404":
          description: Organisation not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                example:
                  status: "error"
                  status_code: 404
                  message: "Organisation not found"

