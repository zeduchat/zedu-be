                            type: boolean
                            description: Indicates whether the user has completed onboarding.
                            example: false
                          is_verified:
                            type: boolean
                            description: Indicates whether the user's email is verified.
                            example: false
                          last_name:
                            type: string
                            description: The user's last name.
                            example: ""
                          password:
                            type: string
                            description: The user's password.
                            example: "telex-707385"
                          phone:
                            type: string
                            description: The user's phone number.
                            example: ""
                          updated_at:
                            type: string
                            format: date-time
                            description: Timestamp of the last time the user's information was updated.
                            example: "1723741256"
                          username:
                            type: string
                            description: The user's username.
                            example: ""
        "400":
