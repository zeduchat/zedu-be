      summary: Publish an agent
      description: Publishes an agent by providing required details such as category, snapshots, how it works, benefits, and why to use.
      tags:
        - Agents
      security:
        - bearerAuth: []
      parameters:
        - name: agent_id
          in: path
          required: true
          description: The unique identifier of the agent to publish.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                  description: Category of the agent. Must match a valid category from the system.
                  example: Knowledge Management
                snapshots:
                  type: array
                  minItems: 1
                  description: A list of snapshots describing the agent.
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                        maxLength: 19
                        description: Short title for the snapshot (max 19 characters).
                        example: Quick Start
                      description:
                        type: string
                        maxLength: 79
                        description: Short description of the snapshot (max 79 characters).
                        example: Helps you get started quickly with minimal setup.
                how_it_works:
                  type: string
                  minLength: 101
                  description: Detailed explanation of how the agent works. Must be more than 100 characters.
                  example: |
                    This agent connects to multiple data sources and leverages AI models to provide 
                    insights in real-time. It integrates seamlessly with your workflow...
                benefits:
                  type: string
                  minLength: 101
                  description: Explanation of the benefits of using the agent. Must be more than 100 characters.
                  example: |
                    Using this agent helps improve productivity by automating repetitive tasks, reducing errors,
                    and providing actionable insights in real time...
                why_use:
                  type: string
                  minLength: 101
                  description: Explanation of why users should choose this agent. Must be more than 100 characters.
                  example: |
                    This agent offers unique value by combining advanced machine learning algorithms with 
                    user-friendly integrations across multiple platforms...
                short_description:
                  type: string
                  minLength: 10
                  maxLength: 30
                  description: Very short descriptoin of the agent
                long_description:
                  type: string
                  minLength: 101
                  description: Long description of the agent

      responses:
        200:
          description: Successfully published the agent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                    description: Status of the response.
                  status_code:
                    type: integer
                    example: 200
                    description: HTTP status code.
                  message:
                    type: string
                    example: agent published successfully.
                    description: A message describing the result.
                  data:

        400:
          description: Invalid request body or parameters.
        401:
          description: Unauthorized – missing or invalid token.
        404:
          description: Agent not found.
        500:
          description: Internal server error.

  /agents/{agent_id}/generate-info:
    post:
      tags:
        - Agents
      summary: Generate informational content for an agent
      description: >
        Generates structured informational content for a given agent, including
        how it works, benefits, why to use it, and illustrative snapshots.  
        Requires authentication.
      security:
        - bearerAuth: []
      parameters:
        - name: agent_id
          in: path
          required: true
          description: The unique identifier of the agent.
          schema:
            type: string
            example: "0198dd2d-7650-7ab7-b141-97e6ac2a7b43"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: The textual description of the agent for which informational content should be generated.
                  example: >
                    This home organizer is a practical and efficient tool designed to help create orderly and functional living spaces. 
                    It offers decluttering tips using methods like the KonMari approach, suggests suitable storage solutions for different rooms or items, 
                    and provides strategies to optimize space and reduce stress. The advice is tailored to the user's home size, lifestyle, and budget, 
                    including maintenance routines to keep things organized. It responds with clear, actionable lists, before-and-after ideas, 
                    and encouragement to support gradual progress in home organization.
      responses:
        "200":
          description: Agent info generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Agent info generated successfully
                  data:
                    type: object
                    properties:
                      how_it_works:
                        type: string
                        example: |
                          # How the Home Organizer Works
                          The home organizer simplifies the decluttering process with structured support.

                          - **Decluttering Tips**: Utilizes methods like the KonMari approach to sort and reduce possessions.
                          - **Customized Solutions**: Offers storage suggestions tailored to specific rooms or items based on user's home and lifestyle.
                          - **Space Optimization**: Provides strategies to maximize space efficiency and minimize stress.
                          - **Maintenance Routines**: Recommends schedules to maintain organization over time.
                      benefits:
                        type: string
                        example: |
                          # Benefits of the Home Organizer
                          Experience a streamlined process to achieve a tidy and functional home.

                          - **Personalized Advice**: Receive tips and solutions adjusted to your home's size, lifestyle, and budget.
                          - **Clear Guidance**: Follow actionable lists and before-and-after ideas that simplify the organizing journey.
                          - **Holistic Approach**: Reduce household stress through consistent, manageable progress in organizing.
                      why_use:
                        type: string
                        example: |
                          # Why Use the Home Organizer
                          Achieving a harmonious living environment is made easier than ever.

                          - **Tailored Strategies**: Benefit from recommendations that suit your personal living situation and needs.
                          - **Encouraging Support**: Stay motivated with positive reinforcement and gradual progress that prevent feeling overwhelmed.
                          - **Cost-Effective Solutions**: Optimize your space efficiently without straining your budget.
                      category:
                        type: string
                        example: "Home Organization & Improvement"
                      snapshots:
                        type: array
                        description: Snapshot summaries of the generated content.
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                              example: "Start Decluttering"
                            description:
                              type: string
                              example: "Implement the KonMari method to efficiently sort and declutter your home."
        "401":
          description: Unauthorized — missing or invalid bearer token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  status_code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: Unauthorized access — valid bearer token required.


