  /invite:
    post:
      tags:
        - Organisation-Invitation
      summary: Send organization invitations to multiple email addresses
      security:
        - bearerAuth: []
      description: |
        This endpoint allows an admin to invite multiple users to join an organization. The admin can specify the role that will be assigned to the invited users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                org_id:
                  type: string
                  format: uuid
                  description: The ID of the organization to which users are being invited.
                  example: "01915226-2cbc-72d8-857b-1b22dc838170"
                emails:
                  type: array
                  items:
                    type: string
                    format: email
                  description: A list of email addresses to send the invitations to.
                  example: 
                    - "blessing@gmail.com"
                    - "mshallom@gmail.com"
                role:
                  type: string
                  format: uuid
                  description: The role that will be assigned to the invited users.
                  example: "123jjfj-nfndjn2-nfjnjn-nnndnfl-fndn"
      responses:
        '201':
          description: Invitations created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  status_code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: "Invitations created successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                          format: email
                          description: The email address to which the invitation was sent.
                          example: "blessing@gmail.com"
                        org_id:
                          type: string
                          format: uuid
                          description: The ID of the organization.
                          example: "01915226-2cbc-72d8-857b-1b22dc838170"
                        status:
                          type: string
                          description: The current status of the invitation.
                          example: "invited"
                        invite_token:
                          type: string
                          description: A unique token associated with the invitation.
                          example: "0d1f072a48c629397f20329d93ac8621"
                        is_telex_user:
                          type: boolean
                          description: Indicates if the invited user is already registered on the platform.
                          example: false
                        invitation_link:
                          type: string
                          description: A link to accept the invitation.
                          example: "http://127.0.0.1:8019/api/v1/invite/accept_org_invitation?org_id=01915226-2cbc-72d8-857b-1b22dc838170?invitation_token=0d1f072a48c629397f20329d93ac8621"
                        sent_at:
                          type: string
                          format: date-time
                          description: The date and time when the invitation was sent.
                          example: "2024-08-15T17:59:45.808970985+01:00"
                        expires_at:
                          type: string
                          format: date-time
                          description: The date and time when the invitation will expire.
                          example: "2024-08-16T17:59:45.808198375+01:00"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorSchema'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorSchema'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorSchema'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnprocessedEntityErrorSchema'
                
