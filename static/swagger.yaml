              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      channel_id:
                        type: string
                        description: Unique identifier for the newly created Group DM channel.
                      channel_type:
                        type: string
                        description: Type of channel.
                      participants:
                        type: array
                        items:
                          type: object
                          properties:
                            user_id:
                              type: string
                              description: Unique identifier of the participant.
                            username:
                              type: string
                              description: Username of the participant.
                            avatar_url:
                              type: string
                              format: uri
                              description: URL of the participant's avatar.
                            email:
                              type: string
                              format: email
                              description: Email of the participant.
