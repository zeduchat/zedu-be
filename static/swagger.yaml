          required: true
          schema:
            type: string
            example: "0191e724-de59-78f8-a582-5cbc83f377fe"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - content
                - type
              properties:
                name:
                  type: string
                  example: Greeting Prompt
                  description: Name of the system prompt.
                content:
                  type: string
                  example: Hello! How can I assist you today?
                  description: The content of the system prompt.
                type:
                  type: string
                  example: tagged prompt
                  description: The content of the system prompt.
      responses:
        200:
          description: Successfully updated the agent's prompts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: prompts updated successfully.
        400:
          description: Invalid agent_id or request body.
        404:
          description: Agent not found.

