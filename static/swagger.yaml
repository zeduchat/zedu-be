                  example: "0191be6d-28ca-7b3c-b0e1-58dc5487ad88"
      responses:
        "201":
          description: Invitation created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Invitation created successfully
                  data:
                    type: object
                    properties:
                      invitation_link:
                        type: string
                        example: accept_org_invitation?org_id=01964d79-283b-710e-9690-c09aa53bb6f3&invitation_token=1b4db7eb-4057-5ddf-91e0-36dec72071f5
                      expires_at:
                        type: string
                        format: date-time
                        example: "2025-05-21T07:36:36.157618+01:00"
                      created_at:
                        type: string
                        format: date-time
                        example: "2025-05-19T07:36:36.157662+01:00"

  /invite/general/verify:
    post:
      tags:
        - General-Invitation
      summary: Verify a general invitation using the invitation token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  example: "1b4db7eb-4057-5ddf-91e0-36dec72071f5"
      responses:
        "409":
          description: User is already a member of the organisation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  status_code:
                    type: integer
                    example: 409
                  message:
                    type: string
                    example: user is already a member of this organisation
                  error:
                    type: object
                    example: {}

  /invite/general/change-status:
    post:
      tags:
        - General-Invitation
      summary: Change the status of a general invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - invitation_id
              properties:
                status:
                  type: boolean
                  example: true
                invitation_id:
                  type: string
                  example: "1b4db7eb-4057-5ddf-91e0-36dec72071f5"
      responses:
        "200":
          description: Invitation status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: invitation updated successfully

  /telexai/chat:
    post:
      tags:
        - TelexAI
      summary: Send a chat message to a TelexAI model
      parameters:
        - in: header
          name: X-TELEX-API-KEY
          schema:
            type: string
          required: true
          example: tlx-TXFh-VN/rfeCdKmeEOPh1J4gXs14Mc568JCGkbzLDcof2JL4qZKqxmjJmrz5G12taqfhlQUFsmZvjPOtEC1n/Q
        - in: header
          name: X-Model
          schema:
            type: string
          required: true
          example: deepseek/deepseek-r1-0528:free
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organisation_id:
                  type: string
                model:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content:
                        type: string
                stream:
                  type: boolean
              required:
                - organisation_id
                - model
                - messages
      responses:
        "200":
          description: Chat response from model
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      Messages:
                        type: object
                        properties:
                          role:
                            type: string
                          content:
                            type: string
  /telexai/models:
    get:
      tags:
        - TelexAI
      summary: List all available models
      parameters:
        - in: header
          name: X-TELEX-API-KEY
          schema:
            type: string
          required: true
          example: tlx-TXFh-VN/rfeCdKmeEOPh1J4gXs14Mc568JCGkbzLDcof2JL4qZKqxmjJmrz5G12taqfhlQUFsmZvjPOtEC1n/Q
      responses:
        "200":
          description: List of models
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      models:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            provider:
                              type: string
                            pricing:
                              type: string
                            context:
                              type: integer
                            created_at:
                              type: string
                              format: date
                            input_cost_per_million:
                              type: number
                            output_cost_per_million:
                              type: number
                            type:
                              type: string
                            description:
                              type: string
                            capabilities:
                              type: array
                              items:
                                type: string
                            tags:
                              type: array
                              items:
                                type: string

  /logs:
    get:
      tags:
        - Logs
      summary: Retrieve server logs
      description: Fetches the last N lines of the server log file. Defaults to the last 100 lines if no limit is specified.
      parameters:
        - name: lines
          in: query
          required: false
          description: Number of lines to fetch from the end of the log file
          schema:
            type: integer
            example: 100
      responses:
        "200":
          description: Logs retrieved successfully
          content:
            text/plain:
              schema:
                type: string
                example: |
                  [2025/06/04 21:49:49 WAT] [fileLogs] [EROR] (github.com/...)
                  [2025/06/04 21:49:53 WAT] [fileLogs] [INFO] (github.com/...)
                  [2025/06/04 21:49:53 WAT] [fileLogs] [EROR] (github.com/...)
                  [2025/06/04 21:49:54 WAT] [fileLogs] [EROR] (github.com/...)
                  [2025/06/04 21:49:58 WAT] [fileLogs] [INFO] (github.com/...)
        "500":
          description: Failed to read logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  status_code:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: "Failed to read logs"
                  error:
                    type: string
                    example: "file not found or inaccessible"

