openapi: 3.0.3
info:
  title: Telex_BE Swagger
  description: |-
    This API provides functionalities for telex_be
  termsOfService: http://example.com/terms/
  contact:
    email: support@example.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
  - url: https://api.staging.telex.im/api/v1
  - url: https://api.telex.im/api/v1
  - url: http://localhost:8019/api/v1

tags:
  - name: auth
    description: API for user registration and authentication
  - name: user
    description: API for users management
  - name: roles
    description: API for organization and role management
  - name: organisation
    description: API for organization related operations
  - name: channels
    description: API for channels endpoint
  - name: tokens
    description: API for centrifuge token related endpoints
  - name: blogs
    description: API for blogs
  - name: contact
    description: API for contact
  - name: testimonials
    description: API for testimomials
  - name: Organisation-Invitation
    description: API for inviting a user into an organisation
  - name: webhooks
    description: API for webhooks related endpoints
  - name: messages
    description: API for message related endpoints
  - name: credits
    description: API for organisation credits related endpoints
  - name: threads
    description: API for threads related endpoints
  - name: user-management
    description: API for user management related endpoints
  - name: Profile
    description: API for user profile related endpoints
  - name: subscription
    description: API for subscriptions related endpoints
  - name: help center
    description: API for help center related endpoints
  - name: Feed_Webhook
    description: API for feeding centrifugo server
  - name: Agents
    description: API for user agents operations
  - name: System Agents
    description: API for system agents operations
  - name: Overview
    description: API for overview operations
  - name: newsletter
    description: API for newsletter related operations
  - name: squeeze
    description: API for squeeze optin related operations
  - name: Channel Agent Settings
    description: API for channel agent settings
  - name: Channel Grouping
    description: API for channel grouping
  - name: Direct Message
    description: API for direct message
  - name: Group Direct Message
    description: API for group direct message
  - name: Bots
    description: API endpoints for bots
  - name: TelexAI
    description: "Endpoints for interacting with the AI proxy service, enabling chat completions"
  - name: File Management
    description: API for uploading and retrieving files
  - name: Search
    description: API endpoints for searching user query
  - name: Agent Database
    description: API endpoints for agent databases
  - name: Notification Preferences
    description: API endpoints for managing notification preferences
  - name: General-Invitation
    description: API endpoints for organisation general invitation
  - name: TelexAI
    description: API endpoints for telex AI
  - name: Logs
    description: API endpoints for retrieving server logs
  - name: Saved Messages
    description: API endpoints for managing messages saved for later
  - name: Pinned-Organisations
    description: API endpoints for managing pinned organisations
  - name: Pinned Messages
    description: API endpoints for pinning a specific message
  - name: Message Forwarding
    description: API endpoints for handling message forwarding
  - name: Skills
    description: API endpoints for agents skills
  - name: Tasks
    description: API endpoints for agents tasks
  - name: Translator
    description: API endpoints for telex markdown to json formatting engine

paths:
  # Auth paths
  /auth/register:
    post:
      tags:
        - auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
                  format: password
                first_name:
                  type: string
                last_name:
                  type: string
                phone_number:
                  type: string
              required:
                - email
                - password
                - username

      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: success response
                    example: success
                  message:
                    type: string
                    example: "user created successfully"
                  status_code:
                    type: integer
                    example: 201

        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorSchema"

        "422":
          description: Unprocessed Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessedEntityErrorSchema"

  /auth/login:
    post:
      tags:
        - auth
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "200":
          description: User login successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: success response
                    example: success
                  status_code:
                    type: integer
                    description: HTTP status Code response
                    example: 200
                  message:
                    type: string
                    example: Login Successfully
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        $ref: "#/components/schemas/UserSchema"
                      access_token:
                        type: string
                        example: "access_token"
                      access_token_expires_in:
                        type: string
                        format: date-time
                      notification_token:
                        type: string
                        format: token
                        example: KADFKIEWKJADFIOAIJE080

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorSchema"
        "422":
          description: Unprocessed Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessedEntityErrorSchema"

  /auth/logout:
    post:
      tags:
        - auth
      summary: logout a user
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Platform
          schema:
            type: string
          required: true
          description: device platform (desktop, mobile or web).
      responses:
        "200":
          description: User logout successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: success response
                    example: success
                  status_code:
                    type: integer
                    description: HTTP status Code response
                    example: 200
                  message:
                    type: string
                    example: Logout Successfully
                  data:
                    type: object
                    example: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorSchema"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "Bad Request"
                  message:
                    type: string
                    example: "message"
                  status_code:
                    type: integer
                    example: 400
  /auth/google:
    post:
      tags:
        - auth
      summary: Endpoint for callback from frontend with token gotten from google oauth provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_code:
                  type: string
              required:
                - grant_code

      responses:
        "200":
          description: user sign in succesfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "user sign in  successfully"
                  status_code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: "access_token"
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            example: "userId_here"
                          email:
                            type: string
                            example: "user@example.com"
                          fullname:
                            type: string
                            example: "John Doe"
                          is_verified:
                            type: boolean
                            example: true
                          username:
                            type: string
                            example: "John Doe"
                          avatar_url:
                            type: string
                            example: "http://example.com/avatar.jpg"
                          expires_in:
                            type: string
                            format: date-time
                            example: "1748982383"
                          created_at:
                            type: string
                            format: date-time
                            example: "1748982383"
                          updated_at:
                            type: string
                            format: date-time
                            example: "1748982383"

        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "Bad Request"
                  message:
                    type: string
                    example: "message"
                  status_code:
                    type: integer
                    example: 400
        "422":
          description: Unprocessed Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessedEntityErrorSchema"

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorSchema"

  /auth/change-password:
    put:
      tags:
        - auth
      summary: Verify the password reset token and set a new password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
              required:
                - old_password
                - new_password

      responses:
        "200":
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Password updated successfully"
                  status_code:
                    type: integer
                    example: 200
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "Bad Request"
                  message:
                    type: string
                    example: "message"
                  status_code:
                    type: integer
                    example: 400
        "422":
          description: Unprocessed Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessedEntityErrorSchema"

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorSchema"

  /auth/magick-link:
    post:
      tags:
        - auth
      summary: Request a magic link for authentication
      description: |-
        Uses Cases:
          - Sign up a new user
          - Sign in an existing user
          - Sign in with auto sign-up a new user if not exists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
                - email
      responses:
        "200":
          description: Magic link sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Magic link sent succesfully"
                  statusCode:
                    type: integer
                    example: 200

        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorSchema"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessedEntityErrorSchema"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorSchema"

  /auth/magick-link/verify:
    post:
      tags:
        - auth
      summary: Verify the magic link token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
      responses:
        "200":
          description: Token verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Token verified successfully"
                  data:
                    $ref: "#/components/schemas/UserSchema"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorSchema"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessedEntityErrorSchema"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorSchema"

  /auth/password-reset:
    post:
      tags:
        - auth
      summary: Request a password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
                - email
      responses:
        "200":
          description: Password reset link sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Password reset link sent successfully"
                  statusCode:
                    type: integer
                    example: 200
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorSchema"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessedEntityErrorSchema"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorSchema"

  /auth/password-reset/verify:
    post:
      tags:
        - auth
      summary: Verify the password reset token and set a new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                new_password:
                  type: string
              required:
                - token
                - new_password

      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Password reset successfully"
                  statusCode:
                    type: integer
                    example: 200
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorSchema"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessedEntityErrorSchema"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorSchema"

  /auth/email-request:
    post:
      tags:
        - auth
      summary: Request an email verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
                - email
      responses:
        "200":
          description: "Verification token sent to email"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Verification token sent to email"
                  statusCode:
                    type: integer
                    example: 200
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorSchema"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessedEntityErrorSchema"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorSchema"

  /auth/email-request/verify:
    post:
      tags:
        - auth
      summary: Verify the token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token

      responses:
        "200":
          description: email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Email verified successfully"
                  statusCode:
                    type: integer
                    example: 200
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorSchema"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessedEntityErrorSchema"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorSchema"

  /auth/onboard-status:
    get:
      tags:
        - auth
      summary: get user onboarding status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: user status fetch successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "user status fetch successfully"
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      status:
                        type: boolean
                        example: false
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorSchema"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessedEntityErrorSchema"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorSchema"

    put:
      tags:
        - auth
      summary: Update user onboarding status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: user onboarding status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "user onboarding status updated successfully"
                  statusCode:
                    type: integer
                    example: 200
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorSchema"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessedEntityErrorSchema"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorSchema"

  /organisations/{orgId}/roles:
    post:
      tags:
        - roles
      summary: Create a new organization role
      security:
        - bearerAuth: []
      description: Creates a new role within an organization.
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the organization to create the role in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgRoleCreateSchema"
      responses:
        "201":
          description: Role created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgRoleCreateResponseSchema"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorSchema"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorSchema"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorSchema"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessedEntityErrorSchema"

    get:
      tags:
        - roles
      summary: Retrieve a list of organization roles
      security:
        - bearerAuth: []
      description: Retrieves a list of roles within an organization.
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the organization to retrieve roles for.
      responses:
        "200":
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgRolesListResponseSchema"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorSchema"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorSchema"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorSchema"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorSchema"

  /organisations/{orgId}/roles/{roleId}:
    get:
      tags:
        - roles
      summary: Retrieve a specific organization role
      security:
        - bearerAuth: []
      description: Retrieves detailed information about a specific role within an organization.
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the organization containing the role.
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the role to retrieve.
      responses:
        "200":
          description: Role retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgRoleResponseSchema"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorSchema"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorSchema"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorSchema"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorSchema"

    put:
      tags:
        - roles
      summary: Update a specific organization role
      security:
        - bearerAuth: []
      description: Updates the details of a specific role within an organization.
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the organization containing the role.
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the role to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgRoleUpdateSchema"
      responses:
        "200":
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgRoleUpdateResponseSchema"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorSchema"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorSchema"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorSchema"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessedEntityErrorSchema"

    delete:
      tags:
        - roles
      summary: Delete a specific organization role
      security:
        - bearerAuth: []
      description: Deletes a specific role within an organization.
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the organization containing the role.
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the role to delete.
      responses:
        "200":
          description: Role deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgRoleDeleteResponseSchema"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestErrorSchema"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedErrorSchema"
