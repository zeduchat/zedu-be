      parameters:
        - name: organisation_id
          in: path
          required: true
          schema:
            type: string
          description: The unique identifier of the organisation.
      responses:
        "200":
          description: Group DM channels retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        channel_id:
                          type: string
                        channel_type:
                          type: string
                        participants:
                          type: array
                          items:
                            type: object
                            properties:
                              user_id:
                                type: string
                              username:
                                type: string
                              avatar_url:
                                type: string
                              email:
                                type: string
                  pagination:
                    type: array
                    items:
                      type: object
                      properties:
                        current_page:
                          type: integer
                        page_size:
                          type: integer
                        total_items:
                          type: integer
                        total_pages:
                          type: integer
    post:
      tags:
        - Group Direct Message
      summary: Create a Group DM Channel
      security:
        - bearerAuth: []
      description: Creates a new Group DM channel with specified participants.
      parameters:
        - name: organisation_id
          in: path
          required: true
          schema:
            type: string
          description: The unique identifier of the organisation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_type:
                  type: string
                  enum: [user]
                  description: Type of chat (currently only "user" is supported).
                participants:
                  type: array
                  items:
                    type: string
                  description: List of user IDs to be added to the Group DM.
              required:
                - chat_type
                - participants
            example:
              chat_type: "user"
              participants:
                - "0195bbf5-87c2-779b-9609-060f6bb8f2b1"
                - "0195bbf5-87c2-779b-9609-060f6bb8f2b2"
                - "0195bbf5-87c2-779b-9609-060f6bb8f2b3"
