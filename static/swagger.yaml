    UnauthorizedErrorSchema:
      type: object
      properties:
        status:
          type: string
          description: |-
            Certain responses will contain this property with the provided values.

            Usually one of these:
            - Unauthorized
            - Forbidden
          example: Unauthorized
        status_code:
          type: integer
          description: >
            The HTTP status code. Usually missing if `error` is present.
          example: 401
        message:
          type: string
          description: >
            A basic message describing the problem with the request. Usually missing if `error` is present.

    ForbiddenErrorSchema:
      type: object
      properties:
        status:
          type: string
          description: |-
            Certain responses will contain this property with the provided values.

            Usually one of these:
            - Forbidden
            - Unauthorized
          example: Forbidden
        statu_code:
          type: integer
          description: >
            The HTTP status code. Usually missing if `error` is present.
          example: 403
        message:
          type: string
          description: >
            A basic message describing the problem with the request. Usually missing if `error` is present.

