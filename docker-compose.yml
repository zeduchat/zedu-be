name: telex_be

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: telex_postgres
    environment:
      POSTGRES_USER: ${USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-telex_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telex_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: telex_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telex_network

  # MongoDB
  mongodb:
    image: mongo:7
    container_name: telex_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-telex_mongo}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telex_network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: telex_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BUCKET_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${BUKCET_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telex_network

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: telex_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - telex_network

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: telex_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telex_network

  # Centrifugo Real-time Server
  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: telex_centrifugo
    volumes:
      - ./config.json:/centrifugo/config.json
    command: centrifugo --config=/centrifugo/config.json
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telex_network

  # Telex Backend Application
  backend:
    image: telex_be:latest
    container_name: telex_backend
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
    env_file:
      - app.env
    environment:
      # Override with container service names
      DB_HOST: db
      REDIS_HOST: redis
      MONGO_URI: mongodb://admin:password@mongodb:27017
      MINIO_ENDPOINT: minio:9000
      ELASTIC_URL: http://elasticsearch:9200
      RABBITMQ_CONNECTION: amqp://admin:password@rabbitmq:5672/
      CENTRIFUGE_URL: http://centrifugo:8000
      SERVER_PORT: 7003
    volumes:
      - ./logs:/usr/src/app/logs
      - ./static:/usr/src/app/static
    ports:
      - "8019:7003"
    restart: unless-stopped
    networks:
      - telex_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: telex_nginx
    depends_on:
      - backend
    ports:
      - "7003:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - telex_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  minio_data:
    driver: local
  elasticsearch_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  telex_network:
    driver: bridge