name: telex_be

services:
  db:
    image: postgres:16
    env_file:
      - app.env
    volumes:
      - ../golang_volumes/pgsql_volumes/telex_be/:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telex_be_user"]
      interval: 5s
      timeout: 5s
      retries: 2

  redis:
    image: redis:latest
    volumes:
      - ../golang_volumes/redis_volumes/telex_be/:/data

  backend:
    image: telex_be:latest
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - app.env
    volumes:
      - ./logs/:/usr/src/app/logs

  nginx:
    image: nginx:latest
    depends_on:
      - backend
    ports:
      - "7003:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf