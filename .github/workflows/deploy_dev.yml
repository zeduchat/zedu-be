name: Dev Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  update_env_and_binary:
    runs-on: self-hosted
    if: github.event.repository.fork == false
    env:
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create app.env file
        uses: vicradon/create-env-action@v1.0.1
        with:
          action_input_file: "app-sample.env"
          action_output_file: "app.env"
          action_true_string_variables: |
            MAIL_PASSWORD
            BUKCET_SECRET_KEY
            TYPESENSE_API_KEY
            CENTRIFUGE_API_KEY
          APP_NAME: "telex_be"
          APP_URL: ${{ secrets.APP_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          WEBHOOK_API_URL: ${{ secrets.WEBHOOK_API_URL }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_HOST: ${{ secrets.DB_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          MIGRATE: "true"
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
          RESET_PASSWORD_DURATION: ${{ secrets.RESET_PASSWORD_DURATION }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          BUCKET_ACCESS_KEY: ${{ secrets.BUCKET_ACCESS_KEY }}
          BUKCET_SECRET_KEY: ${{ secrets.BUKCET_SECRET_KEY }}
          TYPESENSE_API_URL: ${{ secrets.TYPESENSE_API_URL }}
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY}}
          IPSTACK_KEY: ${{ secrets.IPSTACK_KEY }}
          IPSTACK_BASE_URL: ${{ secrets.IPSTACK_BASE_URL }}
          CENTRIFUGE_URL: ${{ secrets.CENTRIFUGE_URL }}
          CENTRIFUGE_API_KEY: ${{ secrets.CENTRIFUGE_API_KEY }}
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
          STRIPE_BASIC_ID: ${{ secrets.STRIPE_BASIC_ID }}
          STRIPE_PREMIUM_ID: ${{ secrets.STRIPE_PREMIUM_ID }}
          STRIPE_ADVANCED_ID: ${{ secrets.STRIPE_ADVANCED_ID }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          SLACK_REDIRECT_URI: ${{ secrets.SLACK_REDIRECT_URI }}
          SLACK_BASE_URL: ${{ secrets.SLACK_BASE_URL }}
          TELEX_LOGIN_CHANNEL: ${{ vars.TELEX_LOGIN_CHANNEL }}
          TELEX_SIGNUP_CHANNEL: ${{ vars.TELEX_SIGNUP_CHANNEL }}
          SERVER_ACCESSTOKENEXPIREDURATION: ${{ vars.SERVER_ACCESSTOKENEXPIREDURATION }}

      - name: Build binary
        run: |
          go build -o telex_be

      - name: Copy app.env to server
        run: |
          echo "$SSH_KEY" > ssh_key.pem
          chmod 400 ssh_key.pem
          scp -o StrictHostKeyChecking=no -i ssh_key.pem app.env $SSH_USERNAME@$SSH_HOST:~/deployments/telex_be/app.env
          rsync -avz -e "ssh -i ssh_key.pem" telex_be $SSH_USERNAME@$SSH_HOST:~/deployments/telex_be
          rm ssh_key.pem
          
  update_and_restart_app:
    runs-on: self-hosted
    needs: [update_env_and_binary]
    if: github.event.repository.fork == false
    env:
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - name: Restart app
        run: |
          echo "$SSH_KEY" > ssh_key.pem
            chmod 400 ssh_key.pem
            ssh -o StrictHostKeyChecking=no -i ssh_key.pem $SSH_USERNAME@$SSH_HOST '
            cd ~/deployments/telex_be
            git reset --hard
            git pull origin dev
            pm2 restart telex_be
          '
          
      - name: Remove ssh_key
        run: rm ssh_key.pem
