name: Deploy Telex Backend - main

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update_env_and_binary:
    runs-on: self-hosted
    if: github.event.repository.fork == false
    env:
      SSH_USERNAME: ${{ secrets.TELEX_SERVER_SSH_USER }}
      SSH_HOST: ${{ secrets.TELEX_SERVER_SSH_HOST }}
      SSH_KEY: ${{ secrets.TELEX_SERVER_SSH_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Build binary
        run: |
          go build -o telexbe_main

      - name: Upload binary to server
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519" telexbe_main $SSH_USERNAME@$SSH_HOST:/var/www/telex_be/telexbe_main
          rm ~/.ssh/id_ed25519

  update_and_restart_app:
    runs-on: self-hosted
    needs: [update_env_and_binary]
    env:
      SSH_USERNAME: ${{ secrets.TELEX_SERVER_SSH_USER }}
      SSH_HOST: ${{ secrets.TELEX_SERVER_SSH_HOST }}
      SSH_KEY: ${{ secrets.TELEX_SERVER_SSH_KEY }}
    steps:
      - name: Restart app
        run: |
          echo "$SSH_KEY" > ssh_key.pem
          chmod 600 ssh_key.pem
          ssh -o StrictHostKeyChecking=no -i ssh_key.pem $SSH_USERNAME@$SSH_HOST '
            cd /var/www/telex_be
            git reset --hard
            git pull origin main
            supervisorctl restart telexbe
          '
          rm ssh_key.pem
