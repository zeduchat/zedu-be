
name: Deploy Telex Backend - main

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update_and_restart_app:
    runs-on: ubuntu-latest
    env:
      SSH_USERNAME: ${{ secrets.TELEX_SERVER_SSH_USER }}
      SSH_HOST: ${{ secrets.TELEX_SERVER_SSH_HOST }}
      SSH_KEY: ${{ secrets.TELEX_SERVER_SSH_KEY }}
      BRANCH: main
      APP_DIR: /var/www/telex_be
      APP_BINARY: telexbe_staging
      SUPERVISOR_PROCESS: telexbe
    steps:
      - name: Build and stop on failure
        run: |
          eval $(ssh-agent -s)
          echo "$SSH_KEY" | ssh-add -

          ssh -o StrictHostKeyChecking=no $SSH_USERNAME@$SSH_HOST << 'ENDSSH'
            cd ${{ env.APP_DIR }}
            git reset --hard
            git pull origin ${{ env.BRANCH }}
            go build -o ${{ env.APP_BINARY }}
          ENDSSH
        
      - name: Run DB migrations
        run: |
          eval $(ssh-agent -s)
          echo "$SSH_KEY" | ssh-add -

          ssh -o StrictHostKeyChecking=no $SSH_USERNAME@$SSH_HOST << 'ENDSSH'
            cd ${{ env.APP_DIR }}
            echo "Running DB migrations..."
            yes | make migrate-safe-up
          ENDSSH

      - name: Restart app
        run: |
          eval $(ssh-agent -s)
          echo "$SSH_KEY" | ssh-add -

          ssh -o StrictHostKeyChecking=no $SSH_USERNAME@$SSH_HOST << 'ENDSSH'
            supervisorctl restart ${{ env.SUPERVISOR_PROCESS }}
          ENDSSH
