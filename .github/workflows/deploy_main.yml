name: Deploy Telex Backend - main

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update_and_restart_app:
    runs-on: ubuntu-latest
    env:
      SSH_USERNAME: ${{ secrets.TELEX_SERVER_SSH_USER }}
      SSH_HOST: ${{ secrets.TELEX_SERVER_SSH_HOST }}
      SSH_PASSWORD: ${{ secrets.TELEX_SERVER_SSH_PASSWORD }}
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
      - name: Restart app
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USERNAME@$SSH_HOST '
            cd /var/www/telex_be
            git reset --hard
            git pull origin main
            go build -o telexbe_main
            supervisorctl restart telexbe
          '
