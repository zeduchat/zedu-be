name: Deploy Telex Backend - main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  update_and_restart_app:
    runs-on: telex-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Change directory
        run: cd /var/www/telex_be

      - name: Pull latest changes from the main branch
        run: git pull origin main

      - name: Build the application binary
        run: go build -o telexbe_main

      - name: Restart the application
        run: |
          sudo systemctl restart telexbe-prod.service
