name: Deploy Telex Backend - staging

on:
  workflow_dispatch:
  push:
    branches:
      - staging
      - testing

jobs:
  update_and_restart_app:
    runs-on: self-hosted
    env:
      SSH_USERNAME: ${{ secrets.TELEX_SERVER_SSH_USER }}
      SSH_HOST: ${{ secrets.TELEX_SERVER_SSH_HOST }}
      SSH_KEY: ${{ secrets.TELEX_SERVER_SSH_KEY }}
      BRANCH: main
      APP_DIR: /var/www/telex_be
      APP_BINARY: telexbe
      SUPERVISOR_PROCESS: telexbe
    steps:
      # - name: Install sshpass
