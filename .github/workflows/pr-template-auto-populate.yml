name: Auto-Populate PR Description

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  contents: read

jobs:
  populate-description:
    runs-on: ubuntu-latest
    name: Add PR Template to Description
    
    steps:
      - name: Check and populate PR description
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.issue.number;
            
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr_number
            });
            
            const currentBody = pr.body || '';
            const bodyLength = currentBody.trim().length;
            
            console.log(`PR #${pr_number} current description length: ${bodyLength}`);
            
            // Only populate if PR has no description or very minimal description (less than 50 chars)
            if (bodyLength < 50) {
              console.log('PR description is empty or minimal, populating with template...');
              
              const template = `## Type of Change
            <!-- Check the type(s) that apply to this PR -->
            
            - [ ] **feat**: A new feature
            - [ ] **fix**: A bug fix
            - [ ] **docs**: Documentation only changes
            - [ ] **style**: Changes that do not affect the meaning of the code (white-space, formatting, etc)
            - [ ] **refactor**: A code change that neither fixes a bug nor adds a feature
            - [ ] **perf**: A code change that improves performance
            - [ ] **test**: Adding missing tests or correcting existing tests
            - [ ] **build**: Changes that affect the build system or external dependencies
            - [ ] **ci**: Changes to CI configuration files and scripts
            - [ ] **chore**: Other changes that don't modify src or test files
            - [ ] **revert**: Reverts a previous commit
            
            ## Description
            <!-- Provide a clear and concise description of what this PR does -->
            
            
            
            ## Related Issue
            <!-- Link to the issue this PR addresses (if applicable) -->
            <!-- Example: Closes #123, Fixes #456, Resolves #789 -->
            
            
            
            ## Motivation and Context
            <!-- Why is this change required? What problem does it solve? -->
            
            
            
            ## How Has This Been Tested?
            <!-- Describe the tests you ran to verify your changes -->
            <!-- Include details of your testing environment, and the tests you ran -->
            
            - [ ] Manual testing
            - [ ] Unit tests
            - [ ] Integration tests
            - [ ] End-to-end tests
            
            **Testing Environment:**
            - Go version: 
            - Database: 
            - OS: 
            
            ## Screenshots (if appropriate)
            <!-- Add screenshots, Postman results, or other visual evidence here -->
            
            
            
            ## Checklist
            <!-- Check all that apply -->
            
            - [ ] My code follows the code style of this project
            - [ ] I have performed a self-review of my own code
            - [ ] I have commented my code, particularly in hard-to-understand areas
            - [ ] I have made corresponding changes to the documentation
            - [ ] My changes generate no new warnings
            - [ ] I have added tests that prove my fix is effective or that my feature works
            - [ ] New and existing unit tests pass locally with my changes
            - [ ] Any dependent changes have been merged and published
            
            ## Breaking Changes
            <!-- Does this PR introduce any breaking changes? If yes, describe them -->
            
            - [ ] Yes, this PR introduces breaking changes
            - [ ] No breaking changes
            
            **If yes, describe the breaking changes:**
            
            
            
            ## Additional Notes
            <!-- Any additional information that reviewers should know -->
            
            
            
            ---
            <!-- 
            💡 Tips for a great PR:
            - Keep PRs focused and small when possible
            - Write clear commit messages following conventional commits format
            - Update relevant documentation
            - Add tests for new functionality
            - Ensure all CI checks pass before requesting review
            -->`;
              
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr_number,
                body: template
              });
              
              console.log('✅ PR description populated with template');
              
              // Add a comment to notify the author
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr_number,
                body: `👋 Hi @${pr.user.login}! I've added a PR template to help you provide all the necessary information. Please fill it out to help reviewers understand your changes better. Thanks! 🙏`
              });
              
            } else {
              console.log('PR already has a description, skipping template population');
            }
