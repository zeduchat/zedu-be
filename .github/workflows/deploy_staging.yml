name: Deploy Telex Backend - staging

on:
  workflow_dispatch:
  push:
    branches:
      - staging

jobs:
  deploy_staging:
    uses: ./.github/workflows/deploy_backend.yml
    with:
      environment: staging
    secrets:
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
