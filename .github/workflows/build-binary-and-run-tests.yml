name: Build Golang Binary and Run Tests
on:
  pull_request:
    branches:
      - staging
  push:
    branches:
      - testing
jobs:
  build_and_test:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Validate swagger.yaml
        uses: GrantBirki/json-yaml-validate@v3.1.0
        with:
          files: ./static/swagger.yaml
      
      - name: Generate randomized binary name
        run: |
          RANDOM_SUFFIX="${GITHUB_RUN_NUMBER}_$(date +%s)"
          BINARY_NAME="telex_be_${RANDOM_SUFFIX}"
          echo "BINARY_NAME=${BINARY_NAME}" >> $GITHUB_ENV
          echo "Generated binary name: ${BINARY_NAME}"

      - name: Verify APP_ENV secret is set
        run: |
          if [ -z "${{ secrets.APP_ENV }}" ]; then
            echo "::error::secrets.APP_ENV is empty or unset"
            exit 1
          fi

      - name: Create test database
        run: |
          DB_NAME="telex_be_copy_${GITHUB_RUN_NUMBER}_$(date +%s)"
          echo "TEST_DB_NAME=${DB_NAME}" >> $GITHUB_ENV

          # Create non-interactively via localhost trust connection
          psql -n -h 127.0.0.1 -U actionsdeployer -d postgres -c "CREATE DATABASE \"${DB_NAME}\";"

          # Dump staging and restore into the new test DB
          pg_dump -n -h 127.0.0.1 -U actionsdeployer telex_staging --no-owner --no-privileges | \
            psql -n -h 127.0.0.1 -U actionsdeployer "${DB_NAME}"

      - name: Setup app.env
        run: | 
          SERVER_PORT=$((40000 + GITHUB_RUN_NUMBER % 10000))
          echo "SERVER_PORT=${SERVER_PORT}" >> $GITHUB_ENV
          echo "${{ secrets.APP_ENV }}" > app.env
          sed -i "s|^DB_URL=.*|DB_URL=postgresql://actionsdeployer@127.0.0.1:5432/${TEST_DB_NAME}?sslmode=disable|" app.env
          sed -i "s/^SERVER_PORT=.*/SERVER_PORT=${SERVER_PORT}/" app.env
          sed -i "s/^TEST_DB_NAME=.*/TEST_DB_NAME=${TEST_DB_NAME}/" app.env
          sed -i "s/^TEST_USERNAME=.*/TEST_USERNAME=actionsdeployer/" app.env
          sed -i "s/^TEST_PASSWORD=.*/TEST_PASSWORD=\"\"/" app.env
          sed -i "s/^DB_NAME=.*/DB_NAME=${TEST_DB_NAME}/" app.env
          sed -i "s/^USERNAME=.*/USERNAME=actionsdeployer/" app.env
          sed -i "s/^PASSWORD=.*/PASSWORD=\"\"/" app.env
      
      - name: Build the application
        run: go build -o ${BINARY_NAME}
      
      - name: Run the application
        run: nohup ./${BINARY_NAME} > /dev/null 2>&1 &
      
      - name: Wait for application to start
        run: |
          SERVER_PORT=$(grep "^SERVER_PORT=" app.env | cut -d'=' -f2)
          for i in {1..30}; do
            curl -s http://localhost:${SERVER_PORT} && break
            sleep 1
          done
      
      - name: Run DB migrations
        run: |
          echo "Running DB migrations..."
          yes | make migrate-safe-up
      
      - name: Run All Tests
        run: go test ./tests/... -timeout 600s
      
      - name: Stop the application
        if: always()
        run: |
          echo "Stopping application: ${BINARY_NAME}"
          pkill -f "${BINARY_NAME}" || echo "Application already stopped or not found"
          sleep 2
      
      - name: Terminate database sessions
        if: always()
        run: |
          if [ -n "${TEST_DB_NAME}" ]; then
            echo "Terminating all sessions for database: ${TEST_DB_NAME}"
            psql -n -h 127.0.0.1 -U actionsdeployer -d postgres -c "
              SELECT pg_terminate_backend(pid)
              FROM pg_stat_activity
              WHERE datname = '${TEST_DB_NAME}'
                AND pid <> pg_backend_pid();
            " || true
          fi

      - name: Cleanup test database
        if: always()
        run: |
          if [ -n "${TEST_DB_NAME}" ]; then
            dropdb -h 127.0.0.1 -U actionsdeployer "${TEST_DB_NAME}" || true
          fi
      
      - name: Cleanup binary
        if: always()
        run: rm -f ${BINARY_NAME}
