name: Build Golang Binary and Run Tests

on:
  pull_request:
    branches:
      - dev

jobs:
  build_and_test:
    runs-on: self-hosted
    strategy:
      matrix:
        typesense-version: ['0.25.2', '26.0']
        typesense-port: ['8108:8108'] # matches the app-sample.env
    env:
      TEST_USERNAME: postgres
      TEST_PASSWORD: password
      TEST_DB_NAME: db_name # must match details in app-sample.env
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_MIGRATE: true

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: ${{ env.TEST_USERNAME }}
          POSTGRES_PASSWORD: ${{ env.TEST_PASSWORD }}
          POSTGRES_DB: ${{ env.TEST_DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U $TEST_USERNAME -d $TEST_DB_NAME"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      typesense:
        image: typesense/typesense:${{ matrix.typesense-version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Create app config file
        run: cp app-sample.env app.env
      - name: Start Typesense
        run: |
          docker run -d \
          --name typesense \
          -p ${{ matrix.typesense-port }} \
          -v /tmp/typesense:/data \
          typesense/typesense:${{ matrix.typesense-version}} \
          --api-key=typesensetestapikey \
          --data-dir /data \
          --enable-cors
      - name: Curl Typesense
        run: sleep 1 && curl http://localhost:8108/health
      - name: Build the application
        run: go build -o telex_be
      - name: Run the application
        run: nohup ./telex_be > /dev/null 2>&1 &
      - name: Wait for application to start
        run: |
          for i in {1..30}; do
            curl -s http://localhost:8019 && break
            sleep 1
          done
      - name: Run All Tests
        run: go test ./... -timeout 300s
