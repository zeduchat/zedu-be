name: Build Golang Binary and Run Tests

on:
  pull_request:
    branches: [staging, dev]
  push:
    branches: [testing]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build_and_test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Validate swagger.yaml
        uses: GrantBirki/json-yaml-validate@v3.1.0
        with:
          files: ./static/swagger.yaml

      - name: Setup env
        run: |
          set -euo pipefail
          [ -n "${{ secrets.APP_ENV }}" ] || { echo "::error::APP_ENV is unset"; exit 1; }

          DB_NAME="telex_be_test_${GITHUB_RUN_NUMBER}_$(date +%s)"
          echo "TEST_DB_NAME=${DB_NAME}" >> $GITHUB_ENV

          psql -n -h 127.0.0.1 -U actionsdeployer -d postgres \
            -c "CREATE DATABASE \"${DB_NAME}\";"

          echo "${{ secrets.APP_ENV }}" > app.env
          sed -i \
            -e "s|^DB_URL=.*|DB_URL=postgresql://actionsdeployer@127.0.0.1:5432/${DB_NAME}?sslmode=disable|" \
            -e "s/^TEST_DB_NAME=.*/TEST_DB_NAME=${DB_NAME}/" \
            -e "s/^DB_NAME=.*/DB_NAME=${DB_NAME}/" \
            -e "s/^TEST_USERNAME=.*/TEST_USERNAME=actionsdeployer/" \
            -e "s/^USERNAME=.*/USERNAME=actionsdeployer/" \
            -e "s/^TEST_PASSWORD=.*/TEST_PASSWORD=\"\"/" \
            -e "s/^PASSWORD=.*/PASSWORD=\"\"/" \
            app.env

      - name: Build
        run: go build ./...

      - name: Migrate
        run: yes | make migrate-safe-up

      - name: Test
        run: |
          set -o pipefail
          go test -p 1 -failfast -timeout 600s ./tests/... 2>&1 | tee test.log

      - name: Show failures
        if: failure()
        run: grep -nE '^(--- )?FAIL|^panic:|\[build failed\]|\[setup failed\]' test.log || true

      - name: Cleanup
        if: always()
        run: |
          psql -n -h 127.0.0.1 -U actionsdeployer -d postgres -c "
            SELECT pg_terminate_backend(pid) FROM pg_stat_activity
            WHERE datname = '${TEST_DB_NAME}' AND pid <> pg_backend_pid();" || true
          dropdb -h 127.0.0.1 -U actionsdeployer "${TEST_DB_NAME}" || true
          rm -f app.env test.log