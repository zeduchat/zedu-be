name: Build Golang Binary and Run Tests

on:
  pull_request:
    branches:
      - staging
  push:
    branches:
      - testing

jobs:
  build_and_test:
    runs-on: self-hosted
    env:
      TEST_USERNAME: postgres
      TEST_PASSWORD: password
      TEST_DB_NAME: db_name # must match details in app-sample.env
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_MIGRATE: true

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: ${{ env.TEST_USERNAME }}
          POSTGRES_PASSWORD: ${{ env.TEST_PASSWORD }}
          POSTGRES_DB: ${{ env.TEST_DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U $TEST_USERNAME -d $TEST_DB_NAME"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Validate swagger.yaml
        uses: GrantBirki/json-yaml-validate@v3.1.0
        with:
          files: ./static/swagger.yaml
      - name: Setup app.env
        uses: vicradon/create-env-action@v1.0.1
        with:
          action_input_file: app-sample.env
          action_output_file: app.env
          TYPESENSE_API_URL: ${{ secrets.TEST_TYPESENSE_API_URL }}
          TYPESENSE_API_KEY: ${{ secrets.TEST_TYPESENSE_API_KEY }}
          CENTRIFUGE_URL: ${{ secrets.CENTRIFUGE_URL }}
          CENTRIFUGE_API_KEY: ${{ secrets.CENTRIFUGE_API_KEY }}

      - name: Build the application
        run: go build -o telex_be
      - name: Run the application
        run: nohup ./telex_be > /dev/null 2>&1 &
      - name: Wait for application to start
        run: |
          for i in {1..30}; do
            curl -s http://localhost:8019 && break
            sleep 1
          done
      - name: Run All Tests
        run: go test ./tests/*.go -timeout 300s
